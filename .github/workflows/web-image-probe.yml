name: Web image probe (manual)

# DIAGNOSTIC AND MANUAL ONLY. It never runs on push or on a pull request.
#
# The full pipeline takes roughly 30 minutes, most of it the backend job's mutation
# run. This builds ONE image and probes it in about five, so a Dockerfile or nginx
# change can be iterated through CI without paying for the whole gate.
#
#   gh workflow run web-image-probe.yml
#   gh run watch          # or: gh run list --workflow=web-image-probe.yml
#
# DOCKER RUNS ON THE GITHUB RUNNER. Nothing here requires Docker on a developer
# machine -- the image is built and run by the hosted runner, and the only thing
# read back locally is the log.
#
# It calls the SAME scripts/probe-web-image.sh as the real pipeline, so this cannot
# report a healthy image that the pipeline would reject (or the reverse).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-image-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Build and probe the web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Same flags as the pipeline's "Build web image" step. The context is the
      # REPO ROOT, because the Dockerfile copies both `web/` files and the built
      # `dist` from the builder stage.
      - name: Build web image
        run: |
          docker buildx build \
            --file web/Dockerfile \
            --tag vc-web:probe \
            --load \
            .

      - name: Probe the container
        run: bash scripts/probe-web-image.sh vc-web:probe
