<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto;">
  <div style="background:#d97706; padding:20px; color:#fff; text-align:center;">
    <strong>VinCommerce</strong>
  </div>
  <div style="padding:24px; border:1px solid #e5e7eb;">
    <h2 style="color:#111827; margin-top:0;">{{ .Title }}</h2>
    <p style="color:#374151;">Hello {{ .Name }},</p>
    <p style="color:#374151;">{{ .Body }}</p>
    {{ if .ActionURL }}
    <p style="text-align:center; margin:28px 0;">
      <a href="{{ .ActionURL }}" style="background:#d97706; color:#fff; padding:12px 28px; border-radius:8px; text-decoration:none;">
        {{ .ActionLabel }}
      </a>
    </p>
    {{ end }}
    {{ if .Expiry }}
    <p style="color:#6b7280; font-size:12px;">This link expires {{ .Expiry }}.</p>
    {{ end }}
    <p style="color:#6b7280; font-size:12px;">If you did not request this, you can safely ignore this email.</p>
  </div>
</body>
</html>
