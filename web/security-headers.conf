# Security response headers, applied by `include` in EVERY location block that
# defines its own `add_header`.
#
# WHY THIS IS A SEPARATE FILE: nginx's `add_header` directives are inherited
# from the enclosing block ONLY if the child block defines no `add_header` of
# its own. One `add_header Cache-Control ...` inside `location /` silently
# discards every header set at the `server` level. That is why the SPA's HTML
# document, every content-hashed asset, /sw.js and /manifest.webmanifest were
# all being served with no CSP, no HSTS and no X-Content-Type-Options: the only
# `add_header` in each of those locations was the Cache-Control line.
#
# `add_header_inherit merge` fixes this, but it landed in nginx 1.29.3 and this
# image is 1.27. Repeating the set is the portable fix.
#
# Included from web/nginx.conf. If this file goes missing nginx refuses to
# start, which is the correct failure mode: silently serving a site with no CSP
# is worse than a container that will not boot.

# Midtrans Snap: snap.js is fetched from the app origin and then injects an
# inline <script> carrying the payment token at runtime. There is no way to
# nonce a script that a third party creates after the document has loaded, so
# 'unsafe-inline' is required for the Midtrans checkout path and is scoped as
# narrowly as CSP allows. Removing it disables Midtrans checkout entirely; keep
# the allow-listed origins in sync with MIDTRANS_ENV (sandbox | production).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://app.midtrans.com https://app.sandbox.midtrans.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com https://api.midtrans.com https://api.sandbox.midtrans.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://app.midtrans.com https://*.midtrans.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

# Only honoured by the browser when the response actually arrives over HTTPS,
# i.e. at the TLS terminator in front of this container. Harmless (and ignored)
# on the plain-HTTP hop.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()" always;

# Cross-origin isolation for the CDN/asset edge. COEP breaks the Midtrans and
# YouTube frames, so only CORP is set here.
add_header Cross-Origin-Resource-Policy "same-site" always;
