server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API accepts media uploads up to 5 MB — the default 1 MB limit here
    # would reject avatars/store logos with 413 before they reach the API.
    client_max_body_size 6m;

    # Baseline security headers for the SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # SSE (/api/v1/stream/*) needs HTTP/1.1 with connection reuse disabled
        # per-request, otherwise upstream responses buffer and streams drop.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /docs {
        proxy_pass http://api:8080;
    }
    location /docs/ {
        proxy_pass http://api:8080;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        # Vite emits content-hashed filenames — cache aggressively.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
