# This file is included from the image's http{} block (it is copied to
# /etc/nginx/conf.d/default.conf), so the top-level directives below are in
# http context and the `server {}` block is a child of it.
#
# It also `include`s /etc/nginx/snippets/security-headers.conf, which web/Dockerfile
# installs. Outside the container that path does not exist and nginx will refuse
# to start — deliberately: a silently-ineffective security header set is worse
# than a container that will not boot.

# Edge rate limiting.
#
# The zone keys on $binary_remote_addr, the direct peer. The `real_ip` block in
# the server{} below rewrites that variable from X-Forwarded-For for any peer
# inside TRUSTED_PROXY_NETWORK, and `realip` runs in the preaccess phase, before
# `limit_req` -- so the bucketing happens on the real client address.
#
# This ordering is load-bearing and was previously wrong. The old comment here
# said "switch to a real_ip module setup before deploying behind a proxy", which
# reads as a TODO and is exactly the kind of note that survives into a real
# deployment. Behind the TLS terminator in infra/compose/compose.tls.yaml, the
# direct peer is the terminator's own IP, so EVERY visitor would have shared ONE
# 30r/s bucket: the edge limiter would have become a self-inflicted denial of
# service that looked like a burst of legitimate traffic.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

# Return the app's own error envelope for 429 rather than nginx's default HTML.
# `lib/api.ts` parses `body.error.code`; a 429 rendered as an HTML error page
# surfaces to the user as a JSON parse failure instead of "terlalu banyak
# permintaan", which is both a worse message and a misleading one.
limit_req_status 429;
error_page 429 = @too_many_requests;

# Upstream keepalive. Without an `upstream` block, nginx opens a new TCP
# connection to api:8080 for every single request; at any real request rate that
# is connection-handshake churn against the API's listener backlog, and it
# defeats HTTP keep-alive entirely.
#
# `resolver` matters for the same reason: nginx resolves `api` once at
# config-parse time, so `docker compose up -d --force-recreate api` gives the
# container a new IP and every proxied request returns 502 until nginx is
# reloaded. 127.0.0.11 is Docker's embedded DNS, and a 10s TTL is well under
# the 30s keepalive_timeout, so a dead backend is detected within one timeout.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream vc_api {
    server api:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ngx_brotli is not compiled into the official nginx images, so this snippet is
# emptied by web/Dockerfile when the module is absent. Keeping it out of
# nginx.conf means `nginx -t` never fails with "unknown directive".
include /etc/nginx/snippets/brotli.conf;

server {
    # 8080, not 80. The container runs as the unprivileged `nginx` user, and
    # binding a port below 1024 is the only thing that would have required root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version. Without this, 400/404/500 error pages
    # and the Server header disclose the exact build to anyone probing.
    server_tokens off;

    # Resolve the real client address for logging AND for the edge rate limiter.
    #
    # TRUSTED_PROXY_NETWORK must be the network the reverse proxy actually lives
    # on, and nothing wider. `set_real_ip_from 0.0.0.0/0` is the classic mistake:
    # it lets ANY client set X-Forwarded-For and choose its own rate-limit bucket
    # and its own audit-logged client IP, which defeats per-IP limiting and
    # corrupts the audit trail in one move.
    #
    # `real_ip_recursive on` makes nginx walk the X-Forwarded-For chain
    # right-to-left and take the last address that is not itself a trusted proxy,
    # which is the only correct reading when more than one proxy is in the path.
    # This mirrors middleware.ClientIP in the Go application, which resolves the
    # same way against TRUSTED_PROXY_CIDRS.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # HTTP/2 on the cleartext hop. The `listen ... http2` parameter is
    # deprecated as of 1.25.1 in favour of this separate directive; the old
    # form is now an error on some builds, so do not "fix" this back.
    http2 on;

    # API accepts media uploads up to 5 MB — the default 1 MB limit here
    # would reject avatars/store logos with 413 before they reach the API.
    client_max_body_size 6m;

    # Temp paths for buffered request bodies and proxied responses. These are
    # valid in http/server/location context and live under /var/cache/nginx,
    # which web/Dockerfile creates and chowns to `nginx`. `pid` cannot go here:
    # it is a main-context directive and this file is included from http{}, so
    # the pid file stays at the image default /var/run/nginx.pid (also chowned
    # to `nginx` in the Dockerfile). Likewise /var/log/nginx for the access and
    # error logs.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Baseline security headers for the SPA.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Compression of already-compressed payloads is pure CPU burn.
    gzip_vary on;

    # ── Server-sent events ────────────────────────────────────────────────
    # `^~` so this wins over the plain `location /api/` prefix below. SSE needs
    # an unbuffered proxy: with buffering on, nginx reads the whole (never
    # ending) response before forwarding the first byte and the stream appears
    # to hang. It was previously handled by `proxy_buffering off` on the
    # blanket /api/ location, which also disabled buffering for every ordinary
    # JSON response — a throughput and memory regression for no benefit.
    location ^~ /api/v1/stream/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://vc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        # Empty Connection header: disables upstream keep-alive for this
        # request only, which is what streaming requires.
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        # Long read timeout so a 25s heartbeat is never mistaken for a dead
        # upstream, and a generous send timeout for slow clients.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Never rate-limit a long-lived stream: one connection legitimately
        # serves hundreds of events.
    }

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://vc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Empty Connection header, so the upstream keepalive pool in
        # upstream vc_api is actually used. Without it nginx sends
        # `Connection: close` and the keepalive is dead configuration.
        proxy_set_header Connection "";

        # Bounded connect and send timeouts. The defaults are 60s, which means a
        # wedged-but-listening API holds a browser request open for a full
        # minute -- while the SPA's axios client gave up at 15s and the user has
        # already seen an error. A 5s connect timeout fails fast when the
        # container is gone; 60s send covers a legitimately slow 5 MB upload.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout   300s;

        # 30r/s sustained with a 60-request burst: comfortably above a normal
        # SPA's API fan-out (a product page issues ~6 calls) while capping a
        # runaway client or credential-stuffling loop.
        limit_req zone=api_per_ip burst=60 nodelay;
    }

    # The 429 that limit_req produces, in the shape lib/api.ts expects.
    # `default_type application/json` matters: without it the browser downloads
    # this as a file.
    #
    # The security-headers include is required, not decorative: this location
    # defines its own `add_header` (Retry-After), and nginx's inheritance rule
    # is that a child block defining ANY add_header discards the entire inherited
    # set. check-nginx.mjs caught exactly that when this location was first
    # added, which is the second time that rule has earned its keep.
    location @too_many_requests {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"terlalu banyak permintaan, coba lagi sebentar"}}';
    }

    # Swagger UI. Deliberately NOT at /docs: the SPA owns a /docs route
    # (web/src/router.tsx) and a /docs/api quickstart page, and proxying
    # /docs here shadowed both, so the product's own documentation was
    # unreachable behind the edge in every containerised deployment. The commit
    # that fixed the dev-mode 404 fixed the wrong layer.
    location = /api-docs {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://vc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /api-docs/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://vc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://vc_api;
        # Only Host was forwarded here; the client address and forwarding chain
        # were dropped.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # NOTE: every location below defines its own `add_header`, so it MUST also
    # include the security-headers snippet. Relying on the server-level
    # headers here is what left the HTML document and every hashed asset
    # unprotected.

    location = /sw.js {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        # Vite emits content-hashed filenames — cache aggressively.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
