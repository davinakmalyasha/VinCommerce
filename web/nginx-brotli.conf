# Brotli compression, alongside gzip.
#
# This file is NOT included by nginx.conf directly. web/Dockerfile copies it to
# /etc/nginx/snippets/brotli.conf and then EMPTIES it unless the nginx build
# reports `--with-brotli`.
#
# Reason: the official nginx images ship only the xslt, geoip, image-filter, njs
# and acme dynamic modules, and nginx.org publishes no `nginx-module-brotli`
# package. A literal `brotli on;` in nginx.conf therefore makes `nginx -t` fail
# with "unknown directive \"brotli\"" and the container never starts. Keeping
# the directives in their own file means the build stays green today and brotli
# turns on by itself the day the base image (or a custom image) gains the module.

brotli on;
brotli_static on;
brotli_comp_level 5;
# Brotli's dictionary is wasted on small or already-compressed payloads, so
# the same minimum-length floor as gzip applies.
brotli_min_length 1024;
brotli_types
    text/css
    text/plain
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml;
