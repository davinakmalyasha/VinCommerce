# TLS terminator for the compose stack.
#
# This is deliberately a SEPARATE nginx from the web image: the web container
# serves the SPA on :8080 over plain HTTP inside the compose network, and this
# one owns the public port, the certificate and the redirect. Mixing the two
# would mean rebuilding the app image to rotate a certificate.
#
# The app's HSTS header was already present on the plain-HTTP listener, where
# browsers ignore it. Here it is on TLS, which is the only place it means
# anything.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Proxy to the web service by name, resolved per request. A static upstream
    # name is resolved at STARTUP, so a probe that runs this container without
    # the web service would fail to boot instead of returning 502 on `/`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Never serve the app over plain HTTP. The host is deliberately not
        # interpolated: a redirect built from $host is a header-injection
        # surface when the Host header is attacker-controlled.
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLSSSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Local liveness for the terminator itself: a probe must be able to
        # prove the TLS listener works without the app being up.
        location = /healthz {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            set $upstream_web web:8080;
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
