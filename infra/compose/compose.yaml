# Local infrastructure for VinCommerce.
# Mirrors infra/scripts/start-deps.ps1 for Docker users.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vincom
      POSTGRES_PASSWORD: vincom_dev
      POSTGRES_DB: vincom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
