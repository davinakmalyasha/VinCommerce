# Local infrastructure for VinCommerce.
# Mirrors infra/scripts/start-deps.ps1 for Docker users.
#
# Base images are digest-pinned for the same reason as compose.full.yaml: a
# floating tag means `docker compose pull` can change what is running under you
# with no diff in this repository. .github/dependabot.yml tracks the digests.
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1g

services:
  postgres:
    <<: *common
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: vincom
      POSTGRES_PASSWORD: vincom_dev
      POSTGRES_DB: vincom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    <<: *common
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command:
      - redis-server
      - --appendonly
      - "yes"
      # See the longer note in compose.full.yaml: this instance also carries the
      # asynq job queue, which must not be evicted under cache pressure.
      - --maxmemory
      - 512mb
      # noeviction: this instance also carries the asynq job queue, whose
      # in-flight task payloads must not be evicted under cache pressure. Cache
      # writes failing is safe (callers swallow cache errors and fall through
      # to Postgres); an evicted order-expiry job is not. Full rationale in
      # compose.full.yaml.
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    <<: *common
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  redisdata:
