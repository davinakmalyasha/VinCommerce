# TLS override for the full compose stack.
#
# Usage:
#   docker compose -f infra/compose/compose.full.yaml -f infra/compose/compose.tls.yaml up -d
#
# Certificates are mounted from infra/tls/certs (fullchain.pem, privkey.pem)
# and are NOT in the repository. Obtain them from the platform's certificate
# manager, certbot, or an internal CA. The terminator is the only service that
# publishes a public port; the web container stays on loopback.
#
# CI validates this file with `docker compose config` and probes a container
# built from the same nginx.conf with a self-signed certificate. There is no
# automated certificate renewal here: that is an operator concern, and a
# renewal hook that silently fails is worse than none.
services:
  tls:
    image: nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8088:80"
    volumes:
      - ../tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tls/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
